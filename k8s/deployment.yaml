apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-graphrag-vision
  labels:
    app: ai-graphrag-vision
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-graphrag-vision
  template:
    metadata:
      labels:
        app: ai-graphrag-vision
    spec:
      containers:
      - name: ai-graphrag-vision
        image: ai-graphrag-vision:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 4001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 4001
          initialDelaySeconds: 15
          periodSeconds: 20
