apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-graphrag-vision-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-graphrag-vision-svc
            port:
              number: 80
